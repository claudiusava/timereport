<div class="pantalla">
  <form class="tarjeta" (ngSubmit)="entrar()" novalidate>
    <div class="logo">
      <img [src]="branding.logoUrl()" alt="" />
      <h1>{{ branding.nombreApp() }}</h1>
      @if (branding.cliente(); as cliente) {
        @if (!cambiandoEmpresa()) {
          <p class="texto-suave">
            {{ cliente.nombre }} ·
            <button type="button" class="enlace" (click)="cambiarEmpresa()">Cambiar de empresa</button>
          </p>
        }
      }
    </div>

    @if (error()) {
      <div class="error-formulario" role="alert">{{ error() }}</div>
    }

    @if (pedirEmpresa()) {
      <label class="campo">
        <span>Código de empresa</span>
        <input class="control" name="empresa" [(ngModel)]="empresa" autocapitalize="none"
               autocomplete="organization" spellcheck="false" />
      </label>
    }

    <label class="campo">
      <span>Usuario</span>
      <input class="control" name="usuario" [(ngModel)]="usuario" autocapitalize="none"
             autocomplete="username" spellcheck="false" />
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input class="control" type="password" name="password" [(ngModel)]="password"
             autocomplete="current-password" />
    </label>

    <button class="boton bloque" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
